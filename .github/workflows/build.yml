name: Build iOS Tweak

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Theos
      uses: unforgiven-dev/install-theos-action@v1

    - name: Compile Tweak
      run: make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CoCTrophyBot-Dylib
        path: packages/*.deb