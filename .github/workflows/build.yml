name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies (ldid)
      run: |
        brew install ldid
      shell: bash

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
      shell: bash

    - name: Compile Tweak
      run: |
        export THEOS=$HOME/theos
        make package
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CoCTrophyBot-Dylib
        path: packages/*.deb